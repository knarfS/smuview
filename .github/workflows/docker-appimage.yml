name: AppImage-Builder Image build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. 22.04-1)"
        required: true
        type: string
      latest:
        description: "Tag as latest"
        required: false
        type: boolean
        default: false

jobs:
  build-and-push:
    name: Build and push smuview/appimage-builder:${{ inputs.tag }}

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    environment:
      name: docker-appimage
      url: https://github.com/knarfS/smuview/pkgs/container/smuview%2Fappimage-builder

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU (for cross-arch build)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name and tags
        id: meta
        run: |
          # GHCR requires lowercase repository names
          IMAGE="ghcr.io/knarfs/smuview/appimage-builder"
          TAGS="${IMAGE}:${{ inputs.tag }}"
          if [ "${{ inputs.latest }}" = "true" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: "{{defaultContext}}:ci/docker/appimage/"
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
