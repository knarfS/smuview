name: SmuView Build

on:
  push:
    paths-ignore:
      - "doxy/**"
      - "manual/**"
      - "stuff/**"
  pull_request:
    paths-ignore:
      - "doxy/**"
      - "manual/**"
      - "stuff/**"
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  # The path where the compiled custom packages will be installed.
  INSTALL_DIR: "${{ github.workspace }}/sr"
  # Git URL for the libserialport dependency
  LIBSERIALPORT_REPO: "git://sigrok.org/libserialport"
  # Git URL for the libsigrok dependency
  LIBSIGROK_REPO: "git://sigrok.org/libsigrok"
  # Git branch for the libsigrok dependency
  LIBSIGROK_BRANCH: "master"
  # Build type for SmuView (Debug, Release, RelWithDebInfo, MinSizeRel)
  BUILD_TYPE: "Release"
  # AppImage related properties are set as container ENVs if needed.

jobs:

  build_linux:
    name: "Linux build (${{ matrix.target }}, ${{ matrix.compiler.compiler }},  Qt: ${{ matrix.qt.source }} ${{ matrix.qt.version }})"

    runs-on: ubuntu-latest

    strategy:
      matrix:
        target: ["x86_64"]
        compiler:
          - { compiler: GCC, cc: "gcc", cxx: "g++" }
          - { compiler: LLVM, cc: "clang", cxx: "clang++" }
        qt:
          - { version: "5.15.2", source: "jurplel", qmake_cmd: "qmake" }
          - { version: "6.8.2", source: "jurplel", qmake_cmd: "qmake" }
          - { version: "6.10.2", source: "jurplel", qmake_cmd: "qmake" }
          - { version: "Qt5", source: "system", qmake_cmd: "qmake" }
          - { version: "Qt6", source: "system", qmake_cmd: "qmake6" }

    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
      QMAKE_CMD: ${{ matrix.qt.qmake_cmd }}

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gcc make autoconf automake libtool \
            g++ autoconf-archive pkg-config libglib2.0-dev libglibmm-2.4-dev \
            libzip-dev libusb-1.0-0-dev libftdi1-dev libieee1284-3-dev \
            libvisa-dev nettle-dev libavahi-client-dev libhidapi-dev check \
            doxygen swig \
            cmake libboost-dev libboost-test-dev \
            python3-dev python-gi-dev python3-setuptools

      - name: Checkout smuview
        uses: actions/checkout@v7
        with:
          path: smuview

      - name: Install Qt via jurplel
        if: matrix.qt.source == 'jurplel'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt.version }}

      - name: Install system Qt5 and system Qwt
        if: matrix.qt.source == 'system' && matrix.qt.version == 'Qt5'
        run: |
          sudo apt-get install -y \
            qtbase5-dev libqt5svg5-dev libqwt-qt5-dev qt5-qmake

      - name: Install system Qt6
        if: matrix.qt.source == 'system' && matrix.qt.version == 'Qt6'
        run: |
          sudo apt-get install -y \
            qt6-base-dev qt6-svg-dev qmake6

      - name: Build custom Qwt
        if: matrix.qt.source == 'jurplel' || matrix.qt.version == 'Qt6'
        run: |
          sudo apt-get install -y \
            mesa-common-dev libgl1-mesa-dev
          smuview/ci/scripts/linux/build_qwt.sh

      - name: Build custom sigrok
        run: |
          smuview/ci/scripts/linux/build_sigrok.sh

      - name: Build smuview
        run: |
          mkdir -p smuview/build
          cd smuview/build
          PKG_CONFIG_PATH="${INSTALL_DIR}/lib/pkgconfig" cmake \
            -DCMAKE_INSTALL_PREFIX:PATH="${INSTALL_DIR}" \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DDISABLE_WERROR=FALSE \
            -DENABLE_TESTS=TRUE \
            ..
          make -j"$(nproc)"


  build_appimage:
    name: SmuView AppImage build (${{ matrix.target.target }})

    runs-on: ubuntu-latest
    container:
      image: ghcr.io/knarfs/sigrok-appimage-${{ matrix.target.container }}:latest

    strategy:
      matrix:
        target:
          - target: "i386"
            container: "x86_64-i386"
            cc: "gcc -m32"
            cxx: "g++ -m32"
            ld: "ld -melf_i386"
            ldflags: "-m32"
          - target: "x86_64"
            container: "x86_64"
            cc: "gcc"
            cxx: "g++"
            ld: "ld"
            ldflags: ""

    env:
      CC: ${{ matrix.target.cc }}
      CXX: ${{ matrix.target.cxx }}
      LD:  ${{ matrix.target.ld }}
      LDFLAGS: ${{ matrix.target.ldflags }}

    steps:
      - name: Update dependencies
        run: |
          sudo apt-get update
          sudo apt-get upgrade -y

      - name: Checkout smuview
        uses: actions/checkout@v3
        with:
          path: smuview

      - name: Build AppImage
        run: |
          wget https://github.com/knarfS/appimagecraft/releases/download/continuous/appimagecraft-${{ matrix.target.target }}.AppImage
          #wget https://github.com/TheAssassin/appimagecraft/releases/download/continuous/appimagecraft-${{ matrix.target.target }}.AppImage
          chmod ug+x appimagecraft-${{ matrix.target.target }}.AppImage

          export PKG_CONFIG_PATH="/usr/lib/i386-linux-gnu/pkgconfig:$PKG_CONFIG_PATH"

          cd smuview
          ../appimagecraft-${{ matrix.target.target }}.AppImage build -d build/

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: SmuView ${{ matrix.target.target }} AppImage
          path: smuview/SmuView*.AppImage*


  build_mxe:
    name: "MXE build (${{ matrix.target.target }})"

    runs-on: ubuntu-latest
    container:
      image: ghcr.io/knarfs/smuview/mxe-builder:0.1

    strategy:
      matrix:
        target:
          - { target: "x86_64", nsis_param: "-DPE64=1" }

    env:
      TARGET: ${{ matrix.target.target }}
      TOOLCHAIN_TRIPLET: "${{ matrix.target.target }}-w64-mingw32.static.posix"
      # MXE_DIR is defined in the sigrok-mxe docker image

    steps:
      - name: Checkout smuview
        uses: actions/checkout@v3
        with:
          path: smuview

      - name: Install custom Python
        run: |
          smuview/ci/scripts/mxe/install_python.sh

      - name: Build custom sigrok
        run: |
          # We need to find tools in the toolchain. (TODO)
          export PATH="${MXE_DIR}/usr/bin:${PATH}"
          export PKG_CONFIG_PATH_x86_64_w64_mingw32_static_posix="${INSTALL_DIR}/lib/pkgconfig":"${MXE_DIR}/usr/${TOOLCHAIN_TRIPLET}/lib/pkgconfig"
          smuview/ci/scripts/mxe/build_sigrok.sh

      - name: Build smuview
        run: |
          # We need to find tools in the toolchain. (TODO)
          export PATH="${MXE_DIR}/usr/bin:${PATH}"
          export PKG_CONFIG_PATH_x86_64_w64_mingw32_static_posix="${INSTALL_DIR}/lib/pkgconfig":"${MXE_DIR}/usr/${TOOLCHAIN_TRIPLET}/lib/pkgconfig"
          mkdir -p smuview/build
          cd smuview/build
          "${TOOLCHAIN_TRIPLET}-cmake" \
            -DCMAKE_INSTALL_PREFIX:PATH="${INSTALL_DIR}" \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DDISABLE_WERROR=FALSE \
            -DENABLE_TESTS=TRUE \
            ..
          make -j"$(nproc)"
          make install/strip

      - name: Build NSIS installer
        run: |
          # Zadig (we ship this with frontends for easy driver switching).
          wget -c --quiet https://github.com/pbatard/libwdi/releases/download/b755/zadig-2.6.exe -O $INSTALL_DIR/zadig.exe

          cp smuview/packaging/mxe/FileAssociation.nsh smuview/build/packaging/mxe
          makensis ${{ matrix.target.nsis_param }} smuview/build/packaging/mxe/smuview_cross.nsi

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: SmuView NSIS ${{ matrix.target.target }} installer
          path: smuview/build/packaging/mxe/SmuView*installer.exe


  build_macos:
    name: "MacOS build (${{ matrix.compiler.compiler }})"

    runs-on: macos-15

    strategy:
      matrix:
        compiler:
          - { compiler: GCC, cc: "gcc", cxx: "g++" }
          - { compiler: LLVM, cc: "llvm-gcc", cxx: "llvm-g++" }

    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
      BREW_QT_VERSION: "qt"
      BREW_QWT_VERSION: "qwt"
      BREW_PYTHON_VERSION: "python@3"

    steps:
      - name: Install dependencies
        run: |
          brew install autoconf automake autoconf-archive pkg-config \
            libtool libzip libusb libftdi hidapi nettle check doxygen swig \
            glib glibmm@2.66 cmake "${BREW_PYTHON_VERSION}" boost "${BREW_QT_VERSION}" "${BREW_QWT_VERSION}"

      - name: Checkout smuview
        uses: actions/checkout@v3
        with:
          path: smuview

      - name: Build custom sigrok
        run: |
          smuview/ci/scripts/macos/build_sigrok.sh

      - name: Build smuview
        run: |
          mkdir -p smuview/build
          cd smuview/build
          PKG_CONFIG_PATH="$INSTALL_DIR/lib/pkgconfig" cmake \
            -DCMAKE_INSTALL_PREFIX:PATH="${INSTALL_DIR}" \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DQwt_ROOT="$(brew --prefix "${BREW_QWT_VERSION}")" \
            -DPython_ROOT_DIR="$(brew --prefix "${BREW_PYTHON_VERSION}")" \
            -DPython_FIND_FRAMEWORK=NEVER \
            -DDISABLE_WERROR=FALSE \
            -DENABLE_TESTS=TRUE \
            ..
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Build DMG
        run: |
          # Source SmuView versions and names
          source smuview/build/contrib/config_version.sh
          smuview/ci/scripts/macos/build_dmg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: SmuView ${{ matrix.compiler.compiler }} DMG
          path: SmuView*.dmg


  verify_windows_installer:
    name: "Windows Installer verification"

    runs-on: windows-latest

    needs: build_mxe

    steps:
      - name: Checkout smuview
        uses: actions/checkout@v7
        with:
          path: smuview

      - name: Download SmuView Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: SmuView NSIS x86_64 installer

      - name: Disable crash dialogs
        shell: pwsh
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting" /v Disabled /t REG_DWORD /d 1 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AeDebug" /v Auto /t REG_SZ /d 0 /f
          reg add "HKCU\SOFTWARE\Microsoft\Windows\Windows Error Reporting" /v DontShowUI /t REG_DWORD /d 1 /f

      - name: Install tool "Dependencies"
        shell: pwsh
        run: choco install dependencies -y

      - name: Silent install SmuView
        shell: pwsh
        run: |
          Move-Item -Path "SmuView-*-installer.exe" -Destination "SmuView-installer.exe"
          $installDir = "$env:ProgramFiles\SmuView"
          Start-Process -FilePath "SmuView-installer.exe" -ArgumentList "/S /V4 /D=$installDir" -Wait

      - name: Scan install tree for unresolved DLL imports
        shell: pwsh
        run: |
          smuview/ci/scripts/windows/verify_dependencies.ps1

      - name: Launch and verify SmuView
        shell: pwsh
        env:
          QT_LOGGING_TO_CONSOLE: "1"
          QT_FORCE_STDERR_LOGGING: "1"
          QT_DEBUG_PLUGINS: "1"
        run: |
          smuview/ci/scripts/windows/verify_installer.ps1

      - name: Upload screenshot
        if: always() && hashFiles('desktop-screenshot-windows.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshot-windows
          path: desktop-screenshot-windows.png

      - name: Selftest Smuview
        shell: pwsh
        env:
          QT_LOGGING_TO_CONSOLE: "1"
          QT_FORCE_STDERR_LOGGING: "1"
          QT_DEBUG_PLUGINS: "1"
        run: |
          $exe = "$env:ProgramFiles\SmuView\smuview.exe"
          & $exe --selftest 2>&1 | ForEach-Object { Write-Output $_ }
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Selftest failed (exit code $LASTEXITCODE)"
            exit 1
          }


  verify_macos_dmg:
    name: "MacOS DMG verification"

    runs-on: macos-latest

    needs: build_macos

    strategy:
      matrix:
        compiler: ["GCC", "LLVM"]

    steps:
      - name: Checkout smuview
        uses: actions/checkout@v7
        with:
          path: smuview

      - name: Download SmuView DMG
        uses: actions/download-artifact@v4
        with:
          name: SmuView ${{ matrix.compiler }} DMG

      - name: Mount DMG and copy
        run: |
          mv SmuView*.dmg SmuView.dmg
          hdiutil attach SmuView.dmg -nobrowse -mountpoint /Volumes/SmuView
          cp -R "/Volumes/SmuView/SmuView.app" /Applications/
          hdiutil detach /Volumes/SmuView

      - name: Launch and verify
        run: |
          smuview/ci/scripts/macos/verify_dmg.sh

      - name: Upload screenshot
        if: always() && hashFiles('desktop-screenshot-macos.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshot-macos
          path: desktop-screenshot-macos.png

      - name: Selftest
        run: |
          if ! "/Applications/SmuView.app/Contents/MacOS/SmuView" --selftest; then
            echo "::error::Selftest failed"
            exit 1
          fi


  publish:
    name: SmuView publish

    runs-on: ubuntu-latest

    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    needs:
      - build_linux
      - build_appimage
      - verify_windows_installer
      - verify_macos_dmg

    steps:
      - name: Install dependencies
        run: |
          # AppImage needs libfuse2 to start
          sudo apt-get update
          sudo apt-get install -y libfuse2
      - name: Download artifacts
        uses: actions/download-artifact@v2
      - name: Inspect directory after downloading artifacts
        run: ls -alFR
      - name: Upload artifacts and create (continuous) release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            wget -q https://github.com/TheAssassin/pyuploadtool/releases/download/continuous/pyuploadtool-x86_64.AppImage
            chmod +x pyuploadtool-x86_64.AppImage
            ./pyuploadtool-x86_64.AppImage **/SmuView-*.*
